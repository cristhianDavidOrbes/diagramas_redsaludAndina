spring:
  application:
    name: redsalud-andina
  profiles:
    default: esqueleto
  jpa:
    open-in-view: false
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0

resilience4j:
  circuitbreaker:
    instances:
      legadoSoap:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
  timelimiter:
    instances:
      legadoSoap:
        timeoutDuration: 5s

redsalud:
  region-permitida: us-east-1
  legado:
    soap-uri: ${LEGADO_SOAP_URI:http://localhost:8089/ws/historial}
    cache-ttl-segundos: 300
  aws:
    s3-adjuntos-bucket: ${S3_ADJUNTOS_BUCKET:redsalud-adjuntos-co}
    s3-auditoria-bucket: ${S3_AUDITORIA_BUCKET:redsalud-auditoria-worm-co}
    kms-key-id: ${KMS_KEY_ID:alias/redsalud-clinico-co}
    sqs-recetas-fifo: ${SQS_RECETAS_FIFO:redsalud-recetas.fifo}
    sqs-sync-fifo: ${SQS_SYNC_FIFO:redsalud-sync.fifo}

---
spring:
  config:
    activate:
      on-profile: esqueleto
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.modulith.events.jpa.JpaEventPublicationAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      - io.awspring.cloud.autoconfigure.core.AwsAutoConfiguration
      - io.awspring.cloud.autoconfigure.core.CredentialsProviderAutoConfiguration
      - io.awspring.cloud.autoconfigure.core.RegionProviderAutoConfiguration
      - io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration
      - io.awspring.cloud.autoconfigure.sqs.SqsAutoConfiguration

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/redsalud
    username: redsalud
    password: redsalud_dev
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    schemas:
      - public
      - identidad
      - agenda
      - episodio
      - receta
      - interconsulta
      - legado
      - auditoria
      - sincronizacion
      - analitica
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:https://auth.redsaludandina.local/realms/teleconsulta}
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
