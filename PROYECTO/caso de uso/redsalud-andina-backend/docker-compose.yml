services:
  postgres:
    image: postgres:16-alpine
    container_name: redsalud-postgres
    environment:
      POSTGRES_DB: redsalud
      POSTGRES_USER: redsalud
      POSTGRES_PASSWORD: redsalud_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redsalud -d redsalud"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redsalud-redis
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:3.8
    container_name: redsalud-localstack
    environment:
      SERVICES: s3,sqs,kms
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
